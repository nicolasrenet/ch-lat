

{% block line_items %}
			{% for line_tuple in line_data %}
			<div class="line">
				<img class="line-img" width="{{line_tuple[4]}}" src="data:img/png;base64, {{line_tuple[2]}}" alt="Charter {{charter_img_id}}: line {{line_tuple[0]}}"/>
				<div class="line-transcription" id="line-{{line_tuple[0]}}">
					<!-- to check for changes at export time -->
					<input class="hidden-transcription" style='display: none;' disabled value='{{line_tuple[1]}}'> 
					<span class="medfontsize">{{line_tuple[0]}}. </span>
					<div class="checked-transcription" style="display:none;">
						{{line_tuple[1]}}
					</div>
					{% if text_size == 'xsmall' %}
							<input class="line-input line-input-xsmall" type="text" value="{{line_tuple[1]}}">
					{% elif text_size == 'small' %}
						<input class="line-input line-input-small" type="text" value="{{line_tuple[1]}}">
					{% else %}
						<input class="line-input line-input-medium" type="text" value="{{line_tuple[1]}}">
					{% endif %}
					<div class='line-controls'>
						<input type="button" id="edit-button-{{line_tuple[0]}}" name="line-edit" value="✍" disabled>
						<input type="checkbox" id="line-flag-discard-{{line_tuple[0]}}" name="line-flag-discard" value="discard">
						<input type="checkbox" id="line-flag-issue-{{line_tuple[0]}}" name="line-flag-issue" value="issue">
					</div>
				</div>
			</div>
			{% endfor %}
{% endblock %}
